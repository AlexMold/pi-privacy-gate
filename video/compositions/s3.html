  <script>
    const tl = gsap.timeline({ paused: true });
    const E_IN = "power4.out";
    const E_SLAM = "power3.in";

    tl.fromTo("#s3-page", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.3, ease: E_IN }, 0.1);
    // bars sit at final width; the rule's sweep is what reveals them
    tl.set("#s3 .bar", { scaleX: 0 }, 0.1);
    tl.fromTo("#s3-rule", { scaleY: 0, x: 0 }, { scaleY: 1, duration: 0.24, ease: "power2.out" }, 0.36);
    tl.to("#s3-rule", { x: 830, duration: 0.62, ease: "power2.inOut" }, 0.62);

    // a bar lands the moment the rule passes its left edge (bar left is page-relative, page at 316px)
    // a bar lands the moment the rule passes its real x position
    const pageX = document.getElementById("s3-page").offsetLeft;
    gsap.utils.toArray("#s3 .pii").forEach((pii) => {
      const barX = pageX + pii.offsetLeft;
      const passT = 0.62 + (0.62 * barX) / 830;
      tl.fromTo(pii.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: E_SLAM }, passT);
    });

    tl.to("#s3-rule", { opacity: 0, duration: 0.2, ease: "none" }, 1.3);
    tl.fromTo("#s3-cap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E_IN }, 1.38);
    tl.fromTo(
      "#s3",
      { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" },
      2.84,
    );

    window.__timelines["s3"] = tl;
